name: Deploy to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fastapi-react-app
  IMAGE_TAG: latest
  INSTANCE_ID: i-0e8d86612f703a12c
  PUBLIC_URL: http://3.108.70.64

jobs:
  build-frontend:
    name: Build frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-and-push-image:
    name: Build and push Docker image to ECR
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure AWS credentials via env
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR and push image
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION="$AWS_REGION"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build -t "$FULL_IMAGE:$IMAGE_TAG" -f Dockerfile .
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker image inspect "$FULL_IMAGE:$IMAGE_TAG" --format 'Image digest: {{index .RepoDigests 0}}'

  deploy:
    name: Deploy image to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Configure AWS credentials via env
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"

      - name: Run SSM deployment commands
        run: |
          set -euo pipefail
          export AWS_DEFAULT_REGION="$AWS_REGION"
          REGION="$AWS_REGION"
          ECR_REGISTRY_LOCAL="$ECR_REGISTRY"
          ECR_REPOSITORY_LOCAL="$ECR_REPOSITORY"
          IMAGE_TAG_LOCAL="$IMAGE_TAG"
          INSTANCE_ID_LOCAL="$INSTANCE_ID"
          FULL_IMAGE="$ECR_REGISTRY_LOCAL/$ECR_REPOSITORY_LOCAL:$IMAGE_TAG_LOCAL"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY_LOCAL",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:8000 --name app -e JWT_SECRET_KEY=\"\$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region $REGION --query SecretString --output text | jq -r .JWT_SECRET_KEY)\" -e JWT_REFRESH_SECRET_KEY=\"\$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region $REGION --query SecretString --output text | jq -r .JWT_REFRESH_SECRET_KEY)\" -e SQL_CONNECTION_STRING=\"\$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region $REGION --query SecretString --output text | jq -r .SQL_CONNECTION_STRING)\" $FULL_IMAGE"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID_LOCAL" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID_LOCAL" \
              --region "$AWS_REGION" \
              --query "Status" --output text)
            echo "Attempt $i status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID_LOCAL" \
                --region "$AWS_REGION" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM command did not complete in time"
          exit 1

  verify:
    name: Health check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check (HTTP 200 required)
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" "$PUBLIC_URL/api/v1/health" || echo "000")
            echo "Attempt $i -> HTTP $HTTP_CODE: $(cat /tmp/health_body.txt || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: health endpoint returned 200."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after all retries."
          exit 1