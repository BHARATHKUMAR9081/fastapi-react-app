name: Build and Deploy FastAPI React App to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fastapi-react-app
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-03fdd22133e18bfe0
  PUBLIC_URL: http://13.202.219.162
  SECRETS_ID: deptic/fastapi-react-app/secrets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static keys)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws sts get-caller-identity
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> /tmp/aws-env
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> /tmp/aws-env

      - name: Build and tag Docker image
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${GITHUB_SHA::7}" -f Dockerfile .
          docker image inspect "$FULL_IMAGE:latest" > /dev/null && echo "Image built successfully"

      - name: Push image to Amazon ECR
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${GITHUB_SHA::7}"

      - name: Fetch app secrets from AWS Secrets Manager
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws secretsmanager get-secret-value --secret-id "$SECRETS_ID" --region "$AWS_REGION" --query SecretString --output text > /tmp/app-secrets.json
          test -s /tmp/app-secrets.json && echo "Secrets retrieved"

      - name: Deploy to EC2 instance via SSM
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy fastapi-react-app image ${GITHUB_SHA::7}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"
          echo "SSM_COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --region "$AWS_REGION" --query "Commands[0].Status" --output text)
            echo "Attempt $i: SSM command status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output text || true
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM command"
          exit 1

      - name: Verify container is running on EC2
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          cat > /tmp/ssm-verify.json << SSMPARAMS
          {
            "commands": [
              "docker ps --filter name=app --format '{{.Names}} {{.Status}} {{.Ports}}'",
              "docker inspect --format '{{.State.Running}}' app",
              "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/api/v1/health || true"
            ]
          }
          SSMPARAMS
          VERIFY_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-verify.json \
            --query "Command.CommandId" --output text)
          sleep 15
          aws ssm get-command-invocation --command-id "$VERIFY_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output text
          RUNNING=$(aws ssm get-command-invocation --command-id "$VERIFY_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text | grep -c "True" || true)
          if [ "$RUNNING" -lt 1 ]; then
            echo "Container 'app' is not running on instance"
            exit 1
          fi

      - name: Health check public URL (must return HTTP 200)
        run: |
          set -euo pipefail
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Checking $HEALTH_URL"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP status $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $HEALTH_URL did not return HTTP 200"
          exit 1