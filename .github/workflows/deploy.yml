name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-00857069f5cc6441a
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  CONTAINER_PORT: "80"
  PUBLIC_URL: http://16.4.70.64

jobs:
  build-push-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (frontend toolchain for diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (backend toolchain for diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Backend build diagnostics
        working-directory: backend
        run: |
          set -e
          python --version
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import fastapi, sqlmodel, uvicorn, jwt, passlib; print('fastapi', fastapi.__version__)"
          python -m compileall -q app
          python -c "from app.main import app; print('FastAPI app import OK:', app.title)"

      - name: Frontend build diagnostics
        working-directory: frontend
        run: |
          set -e
          node --version
          npm --version
          npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html && echo "Vite dist bundle OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and authenticate to ECR (AWS CLI)
        id: image
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          {
            echo "registry=$ECR_REGISTRY"
            echo "tag=$IMAGE_TAG"
            echo "full_image=$FULL_IMAGE"
            echo "latest_image=$LATEST_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Registry: $ECR_REGISTRY"
          echo "Image: $FULL_IMAGE"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (repo-root context, Dockerfile at .)
        run: |
          set -e
          docker build \
            -t "${{ steps.image.outputs.full_image }}" \
            -t "${{ steps.image.outputs.latest_image }}" \
            -f Dockerfile \
            .
          docker image inspect "${{ steps.image.outputs.full_image }}" --format 'Image {{.Id}} size {{.Size}}'

      - name: Smoke-test container locally on port 80
        run: |
          set -e
          docker run -d --name smoke \
            -p 80:80 \
            -e JWT_SECRET_KEY=ci-secret \
            -e JWT_REFRESH_SECRET_KEY=ci-refresh-secret \
            -e SQL_CONNECTION_STRING=sqlite:///database.db \
            "${{ steps.image.outputs.full_image }}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:80/api/v1/health >/dev/null 2>&1; then
              echo "Container health endpoint responded"
              break
            fi
            sleep 2
          done
          BODY=$(curl -fsS http://127.0.0.1:80/api/v1/health)
          echo "Health body: $BODY"
          echo "$BODY" | grep -q "OK"
          curl -fsS http://127.0.0.1:80/ | grep -qi "<div id=\"root\">" && echo "SPA served on port 80"
          docker logs smoke
          docker rm -f smoke

      - name: Push image to Amazon ECR
        run: |
          set -e
          docker push "${{ steps.image.outputs.full_image }}"
          docker push "${{ steps.image.outputs.latest_image }}"
          aws ecr describe-images \
            --repository-name fastapi-react-app \
            --region "$AWS_REGION" \
            --image-ids imageTag="${{ steps.image.outputs.tag }}" \
            --query 'imageDetails[0].[imageTags[0],imageSizeInBytes]' --output text

      - name: Deploy to EC2 via SSM send-command (docker pull/run on port 80)
        run: |
          set -e
          IMAGE_URI="${{ steps.image.outputs.full_image }}"
          ECR_REGISTRY="${{ steps.image.outputs.registry }}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull IMAGE_URI_PLACEHOLDER",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region ap-south-1 --query SecretString --output text)",
              "JWT_SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET_KEY\", d.get(\"jwt_secret_key\", \"\")))')",
              "JWT_REFRESH_SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_REFRESH_SECRET_KEY\", d.get(\"jwt_refresh_secret_key\", \"\")))')",
              "SQL_CONNECTION_STRING=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SQL_CONNECTION_STRING\", d.get(\"sql_connection_string\", \"sqlite:///database.db\")))')",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET_KEY=\"$JWT_SECRET_KEY\" -e JWT_REFRESH_SECRET_KEY=\"$JWT_REFRESH_SECRET_KEY\" -e SQL_CONNECTION_STRING=\"$SQL_CONNECTION_STRING\" IMAGE_URI_PLACEHOLDER",
              "docker ps --filter name=app --format 'table {{.Names}}\\t{{.Status}}\\t{{.Ports}}'"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_URI_PLACEHOLDER|$IMAGE_URI|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "CommandId: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed; stdout/stderr below"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text

      - name: Verify production health endpoint returns HTTP 200
        run: |
          set -e
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Waiting for $HEALTH_URL ..."
          OK=0
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /tmp/health-body -w '%{http_code}' "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              OK=1
              break
            fi
            sleep 5
          done
          if [ "$OK" != "1" ]; then
            echo "Health check never returned HTTP 200"
            exit 1
          fi
          cat /tmp/health-body
          echo ""
          CODE_ROOT=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/")
          echo "Root URL HTTP status: $CODE_ROOT"
          if [ "$CODE_ROOT" != "200" ]; then
            echo "Root URL did not return HTTP 200"
            exit 1
          fi
          echo "Production deployment verified at $PUBLIC_URL"