name: Build and Deploy FastAPI React App to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fastapi-react-app
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-0e8d86612f703a12c
  PUBLIC_URL: http://3.108.70.64
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws sts get-caller-identity

      - name: Build Docker image
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" -t "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" -f Dockerfile .
          docker image inspect "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      - name: Login to Amazon ECR and push image
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      - name: Deploy via SSM to EC2 instance
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export ECR_REPOSITORY=fastapi-react-app",
              "export IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "CommandPlugins" --output text
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then exit 1; fi

      - name: Verify deployment health
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/api/v1/health" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed."
              curl -s "$PUBLIC_URL/api/v1/health"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after retries."
          exit 1