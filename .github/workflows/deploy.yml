name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  INSTANCE_ID: i-0a6b402d2b8ad611f
  PUBLIC_URL: http://13.207.235.248
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  CONTAINER_PORT: "8000"

jobs:
  build-backend-tests:
    name: Backend install + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt
          python3 -m pip install -r backend/dev-requirements.txt

      - name: Run backend test suite (diagnostics)
        working-directory: backend
        run: |
          set -euo pipefail
          export JWT_SECRET_KEY=my-secret
          export JWT_REFRESH_SECRET_KEY=another-secret
          export SQL_CONNECTION_STRING=sqlite:///database.db
          python3 -m pytest -vv

  build-frontend:
    name: Frontend install + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (diagnostics)
        working-directory: frontend
        run: npm run build

  deploy-ec2-docker:
    name: Build image, push to ECR, deploy via SSM to EC2
    runs-on: ubuntu-latest
    needs: [build-backend-tests, build-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build frontend bundle for image
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials (static env vars)
        run: |
          set -euo pipefail
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_REGION=$AWS_REGION"
            echo "AWS_DEFAULT_REGION=$AWS_REGION"
          } >> "$GITHUB_ENV"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (AWS CLI)
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY" | cut -d/ -f1)"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context = repository root, port 8000)
        run: |
          set -euo pipefail
          IMAGE_TAG="$(git rev-parse --short HEAD)"
          FULL_IMAGE="$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          docker build -t "$FULL_IMAGE" -t "$ECR_REPOSITORY:latest" .
          docker images "$ECR_REPOSITORY"

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY:latest"

      - name: Write SSM commands payload to file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:latest",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_VARS=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region ap-south-1 --query SecretString --output text)",
              "docker run -d --restart always --name app -p 80:8000 --env JWT_SECRET_KEY=$(echo \"$ENV_VARS\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"JWT_SECRET_KEY\"])') --env JWT_REFRESH_SECRET_KEY=$(echo \"$ENV_VARS\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"JWT_REFRESH_SECRET_KEY\"])') --env SQL_CONNECTION_STRING=$(echo \"$ENV_VARS\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"SQL_CONNECTION_STRING\"])') $IMAGE_URI",
              "sleep 5",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

      - name: Deploy to EC2 instance via SSM send-command
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: $COMMAND_ID"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment command succeeded"
              exit 0
            fi
            if [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ]; then
              sleep 10
              continue
            fi
            echo "SSM command failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text || true
            exit 1
          done
          echo "Timed out waiting for SSM command"
          exit 1

      - name: Verify deployment health endpoint returns HTTP 200
        run: |
          set -euo pipefail
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Probing $HEALTH_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Health check succeeded with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check never returned HTTP 200"
          exit 1