name: Build and Deploy FastAPI React App to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fastapi-react-app
  INSTANCE_ID: i-03fdd22133e18bfe0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id "${
            { secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "${{ env.AWS_REGION }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URI
        run: |
          echo "IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_URI:latest" -t "$IMAGE_URI:${{ github.sha }}" -f Dockerfile .
          docker images "$IMAGE_URI"

      - name: Login to Amazon ECR and push
        run: |
          ECR_REGISTRY=$(echo "$IMAGE_URI" | cut -d'/' -f1)
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$IMAGE_URI:latest"
          docker push "$IMAGE_URI:${{ github.sha }}"

      - name: Deploy to EC2 via SSM
        run: |
          ECR_REGISTRY=$(echo "$IMAGE_URI" | cut -d'/' -f1)
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${IMAGE_URI}:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET_KEY=${JWT_SECRET_KEY} -e JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY} -e SQL_CONNECTION_STRING=${SQL_CONNECTION_STRING} ${IMAGE_URI}:latest"
            ]
          }
          SSMPARAMS
          sed -i "s|\${AWS_REGION}|${{ env.AWS_REGION }}|g; s|\${ECR_REGISTRY}|$ECR_REGISTRY|g; s|\${IMAGE_URI}|$IMAGE_URI|g; s|\${JWT_SECRET_KEY}|${{ secrets.JWT_SECRET_KEY }}|g; s|\${JWT_REFRESH_SECRET_KEY}|${{ secrets.JWT_REFRESH_SECRET_KEY }}|g; s|\${SQL_CONNECTION_STRING}|${{ secrets.SQL_CONNECTION_STRING }}|g" /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ env.INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" --document-name "AWS-RunShellScript" --comment "Deploy app" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.INSTANCE_ID }}" --region "${{ env.AWS_REGION }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ env.INSTANCE_ID }}" --region "${{ env.AWS_REGION }}"

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://13.202.219.162/api/v1/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1