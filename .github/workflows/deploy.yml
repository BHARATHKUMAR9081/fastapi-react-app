name: build-deploy-verify-fastapi-react

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-0a6b402d2b8ad611f
  PUBLIC_URL: http://13.207.235.248
  CONTAINER_PORT: "80"
  DOCKERFILE_PATH: .
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets

jobs:
  build-and-push-image:
    name: Build diagnostics and push Docker image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (frontend builder parity)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python 3.10 (backend manifest parity)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Frontend build diagnostics (manifest + entrypoints)
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f frontend/package.json
          test -f frontend/index.html
          test -f frontend/src/main.tsx
          test -f frontend/src/App.tsx
          python -c "import json; pkg=json.load(open('frontend/package.json')); print('frontend name:', pkg['name']); print('build script:', pkg['scripts']['build'])"

      - name: Backend build diagnostics (manifest + module compile)
        run: |
          set -euo pipefail
          python --version
          test -f backend/requirements.txt
          test -f backend/app/main.py
          test -f backend/app/api/api_v1/router.py
          test -f backend/.env.example
          python -m py_compile backend/app/main.py backend/app/api/api_v1/router.py
          grep -E "fastapi|uvicorn|sqlmodel" backend/requirements.txt || true

      - name: Dockerfile diagnostics (context, port, healthcheck)
        run: |
          set -euo pipefail
          test -f Dockerfile || { echo "Dockerfile missing at repo root"; exit 1; }
          grep -E "^EXPOSE 80" Dockerfile
          grep -E "HEALTHCHECK" Dockerfile
          grep -E "uvicorn app.main:app" Dockerfile

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE_TAG="${GITHUB_RUN_ID}-${SHORT_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          {
            echo "image_tag=${IMAGE_TAG}"
            echo "image_uri=${IMAGE_URI}"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (static credentials)
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Static AWS credentials detected from environment."
          else
            echo "AWS credentials not present in environment; exporting placeholders so AWS CLI can resolve profile chain."
          fi
          aws configure set region "${AWS_REGION}" || true
          aws --version

      - name: Amazon ECR login (direct AWS CLI)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Build production image (repo-root context) and load locally
        run: |
          set -euo pipefail
          docker build \
            -t "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" \
            -t "${ECR_REPOSITORY_URI}:latest" \
            -f Dockerfile "${DOCKERFILE_PATH}"
          docker images "${ECR_REPOSITORY_URI}"

      - name: Local container smoke test (port 80, /api/v1/health)
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -p 8080:80 \
            -e JWT_SECRET_KEY=ci-secret \
            -e JWT_REFRESH_SECRET_KEY=ci-refresh-secret \
            -e "SQL_CONNECTION_STRING=sqlite:////data/database.db" \
            "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          for i in $(seq 1 30); do
            CODE="$(docker exec smoke curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health || true)"
            if [ "$CODE" = "200" ]; then echo "Local health OK (HTTP $CODE)"; break; fi
            sleep 2
            if [ "$i" -eq 30 ]; then docker logs smoke; exit 1; fi
          done
          docker stop smoke && docker rm smoke

      - name: Push image to Amazon ECR
        run: |
          set -euo pipefail
          docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS CLI (static credentials)
        run: |
          set -euo pipefail
          aws configure set region "${AWS_REGION}" || true
          aws --version

      - name: Write SSM command payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build-and-push-image.outputs.image_uri }}
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:IMAGE_TAG_PLACEHOLDER",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region $REGION --query SecretString --output text)",
              "JWT_SECRET_KEY=$(echo $SECRET_JSON | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET_KEY\",\"\"))')",
              "JWT_REFRESH_SECRET_KEY=$(echo $SECRET_JSON | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_REFRESH_SECRET_KEY\",\"\"))')",
              "SQL_CONNECTION_STRING=$(echo $SECRET_JSON | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SQL_CONNECTION_STRING\",\"sqlite:////data/database.db\"))')",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET_KEY=$JWT_SECRET_KEY -e JWT_REFRESH_SECRET_KEY=$JWT_REFRESH_SECRET_KEY -e SQL_CONNECTION_STRING=$SQL_CONNECTION_STRING $IMAGE_URI"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_URI##*:}|g" /tmp/ssm-params.json
          echo "SSM payload written:"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM command status: ${STATUS}"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text || true
            exit 1
          fi

  verify-production:
    name: Verify public deployment health
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="${PUBLIC_URL}/api/v1/health"
          echo "Probing ${HEALTH_URL}"
          for i in $(seq 1 45); do
            CODE="$(curl -s -o /tmp/body.json -w '%{http_code}' "${HEALTH_URL}" || true)"
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              cat /tmp/body.json || true
              echo "Health check passed with HTTP 200."
              exit 0
            fi
            sleep 4
          done
          echo "Health check failed; deployment did not return HTTP 200."
          exit 1

      - name: Verify SPA served by Nginx on port 80
        run: |
          set -euo pipefail
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/")"
          echo "Root URL HTTP status: ${CODE}"
          if [ "$CODE" != "200" ]; then exit 1; fi