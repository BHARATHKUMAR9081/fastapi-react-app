name: Build, Deploy and Verify (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-00857069f5cc6441a
  PUBLIC_URL: http://16.4.70.64
  CONTAINER_PORT: "80"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-and-push:
    name: Build diagnostics and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (frontend toolchain diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (backend toolchain diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build diagnostics - repository layout
        run: |
          set -euo pipefail
          echo "--- repository tree (top levels) ---"
          ls -la
          echo "--- backend ---"
          ls -la backend
          echo "--- frontend ---"
          ls -la frontend

      - name: Build diagnostics - backend (FastAPI / SQLModel, Python 3.10)
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          echo "--- backend/requirements.txt (pinned deps) ---"
          head -n 20 backend/requirements.txt
          python -m pip install --no-cache-dir -r backend/requirements.txt
          python - <<'PYEOF'
          import fastapi, sqlmodel, pydantic, uvicorn, jwt, passlib
          print("fastapi", fastapi.__version__)
          print("sqlmodel", sqlmodel.__version__)
          print("pydantic", pydantic.VERSION)
          print("uvicorn", uvicorn.__version__)
          PYEOF
          (cd backend && python -c "from app.main import app; print('FastAPI app import OK:', app.title)")

      - name: Build diagnostics - frontend (Vite + React + TypeScript)
        run: |
          set -euo pipefail
          node --version
          npm --version
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html && echo "Vite build produced dist/index.html"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_TAG="${GITHUB_RUN_ID}-${SHORT_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "ECR registry: ${ECR_REGISTRY}"
          echo "Image URI:    ${IMAGE_URI}"

      - name: AWS CLI - authenticate with static credentials
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: AWS CLI - login to ECR
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build unified Docker image (nginx + uvicorn, port 80) and push to ECR
        run: |
          set -euo pipefail
          IMAGE_URI="${{ steps.meta.outputs.image_uri }}"
          docker build \
            --file Dockerfile \
            --tag "${ECR_REPOSITORY_URI}:latest" \
            --tag "${IMAGE_URI}" \
            .
          docker push "${ECR_REPOSITORY_URI}:latest"
          docker push "${IMAGE_URI}"

      - name: Build diagnostics - image inspection
        run: |
          set -euo pipefail
          IMAGE_URI="${{ steps.meta.outputs.image_uri }}"
          docker images --no-trunc | head -n 20
          docker inspect "${IMAGE_URI}" --format 'ExposedPorts: {{json .Config.ExposedPorts}}'

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: AWS CLI - authenticate with static credentials
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Deploy image on EC2 instance via SSM RunShellScript
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "export REGION=${AWS_REGION}",
              "export ECR_REGISTRY=${ECR_REGISTRY}",
              "export IMAGE_URI=${IMAGE_URI}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "aws s3 cp s3://deptic-fastapi-react-artifacts/env/.env /tmp/app.env || aws secretsmanager get-secret-value --region ${AWS_REGION} --secret-id deptic/fastapi-react-app/secrets --query SecretString --output text > /tmp/app.env || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /tmp/app.env -e SQL_CONNECTION_STRING=sqlite:///database.db $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command id: ${COMMAND_ID}"

          STATUS=""
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: ${STATUS}"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status ${STATUS}" ; exit 1 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command did not succeed in time"; exit 1; }

          echo "--- SSM stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text
          echo "--- SSM stderr ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardErrorContent" --output text || true

  verify-deployment:
    name: Verify public endpoint health
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Wait for container startup (nginx + uvicorn boot)
        run: sleep 20

      - name: Health check - API via nginx proxy (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="${PUBLIC_URL}/api/v1/health"
          echo "Checking ${HEALTH_URL}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || true)
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed; last HTTP code: ${CODE}"
          exit 1

      - name: Health check - frontend served on port 80 (HTTP 200 required)
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/")
          echo "HTTP ${CODE} for ${PUBLIC_URL}/"
          [ "$CODE" = "200" ] || exit 1
          grep -qi '<div id="root">' /tmp/index.html && echo "SPA index.html served correctly"

      - name: Deployment summary
        run: |
          {
            echo "## Deployment Summary"
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| Public URL | ${PUBLIC_URL} |"
            echo "| Public IP | 16.4.70.64 |"
            echo "| EC2 instance | ${EC2_INSTANCE_ID} |"
            echo "| ECR repository | ${ECR_REPOSITORY_URI} |"
            echo "| Container port | ${CONTAINER_PORT} |"
            echo "| Health endpoint | ${PUBLIC_URL}/api/v1/health |"
          } >> "$GITHUB_STEP_SUMMARY"