name: build-deploy-verify-fastapi-react

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-0a6b402d2b8ad611f
  PUBLIC_URL: http://13.207.235.248
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  CONTAINER_PORT: "80"

jobs:
  build-and-push-image:
    name: Build diagnostics and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (frontend toolchain diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python (backend toolchain diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Backend build diagnostics (requirements.txt audit)
        working-directory: backend
        run: |
          set -euo pipefail
          python --version
          echo "--- backend/requirements.txt (pinned deps) ---"
          grep -Ev '^\s*(#|$)' requirements.txt | tee /tmp/requirements-pins.txt
          echo "--- key frameworks ---"
          grep -E '^(fastapi|uvicorn|sqlmodel|pydantic)' /tmp/requirements-pins.txt
          test -f app/main.py
          test -f app/api/api_v1/router.py
          grep -RIn "/health" app/api/api_v1/router.py

      - name: Frontend build diagnostics (package.json audit)
        working-directory: frontend
        run: |
          set -euo pipefail
          node --version
          npm --version
          echo "--- scripts ---"
          node -e "console.log(JSON.stringify(require('./package.json').scripts, null, 2))"
          test -f index.html
          test -f src/main.tsx

      - name: Set image tag and URI
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE_TAG="${SHORT_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Building image: ${IMAGE_URI}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to ECR (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "${ECR_REPOSITORY_URI}" | cut -d'/' -f1)"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Build production image (repo-root Dockerfile, multi-stage)
        run: |
          set -euo pipefail
          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REPOSITORY_URI}:latest" \
            -f Dockerfile \
            .

      - name: Image diagnostics (port 80 exposure check)
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_URI}" \
            --format 'ExposedPorts: {{json .Config.ExposedPorts}}'
          docker image inspect "${IMAGE_URI}" \
            --format 'Cmd: {{json .Config.Cmd}}'

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "${IMAGE_URI}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy image on EC2 instance (SSM send-command)
        env:
          IMAGE_URI: ${{ needs.build-and-push-image.outputs.image_uri }}
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "${ECR_REPOSITORY_URI}" | cut -d'/' -f1)"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:__IMAGE_TAG__",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRETS_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region ap-south-1 --query SecretString --output text)",
              "JWT_SECRET_KEY=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"JWT_SECRET_KEY\",\"\"))')",
              "JWT_REFRESH_SECRET_KEY=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"JWT_REFRESH_SECRET_KEY\",\"\"))')",
              "SQL_CONNECTION_STRING=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"SQL_CONNECTION_STRING\",\"sqlite:////data/database.db\"))')",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET_KEY=\"$JWT_SECRET_KEY\" -e JWT_REFRESH_SECRET_KEY=\"$JWT_REFRESH_SECRET_KEY\" -e SQL_CONNECTION_STRING=\"$SQL_CONNECTION_STRING\" $IMAGE_URI"
            ]
          }
          SSMPARAMS
          sed -i "s|__IMAGE_TAG__|${{ needs.build-and-push-image.outputs.image_tag }}|g" /tmp/ssm-params.json
          echo "--- SSM commands payload ---"
          cat /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM command status: ${STATUS}"
          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text || true
            exit 1
          fi

  verify-deployment:
    name: Verify public health endpoint
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="${PUBLIC_URL}/api/v1/health"
          echo "Polling ${HEALTH_URL}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "${HEALTH_URL}" || true)
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "--- body ---"
              cat /tmp/health.json || true
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from ${HEALTH_URL}"
          exit 1

      - name: Verify public URL serves the SPA
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/index.html -w '%{http_code}' "${PUBLIC_URL}/")
          echo "GET / -> HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "Root URL did not return HTTP 200"
            exit 1
          fi
          head -c 500 /tmp/index.html || true