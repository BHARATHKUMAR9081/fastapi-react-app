name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-00857069f5cc6441a
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  CONTAINER_PORT: "8000"
  PUBLIC_URL: http://16.4.70.64
  HEALTH_URL: http://16.4.70.64/api/v1/health

jobs:
  build-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/dev-requirements.txt

      - name: Provide test secrets from .env.example
        run: |
          cp backend/.env.example backend/.env

      - name: Run backend test suite (diagnostics)
        run: |
          cd backend
          python -m pytest -vv || { echo "::error::Backend pytest failed"; exit 1; }

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend (diagnostics)
        run: |
          cd frontend
          npm run build || { echo "::error::Frontend build failed"; exit 1; }
          ls -la dist || true

  deploy-ec2-docker:
    runs-on: ubuntu-latest
    needs: [build-backend-tests, build-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies and build assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build diagnostics - compile backend source
        run: |
          python -m compileall -q backend/app
          echo "Backend compile check passed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and Dockerfile
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          IMAGE_URI="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "Resolved ECR registry: $ECR_REGISTRY"
          echo "Resolved image URI: $IMAGE_URI"

      - name: Generate Dockerfile (repo root context, serves built frontend + FastAPI on port 8000)
        run: |
          cat > Dockerfile << 'DOCKERFILE'
          FROM node:18 AS frontend-build
          WORKDIR /build/frontend
          COPY frontend/package*.json ./
          RUN npm ci || npm install
          COPY frontend/ ./
          RUN npm run build

          FROM python:3.10-slim
          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1
          WORKDIR /app
          COPY backend/requirements.txt ./requirements.txt
          RUN pip install --no-cache-dir --upgrade pip && \
              pip install --no-cache-dir -r requirements.txt
          COPY backend/ ./backend/
          COPY --from=frontend-build /build/frontend/dist ./frontend/dist
          EXPOSE 8000
          CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          DOCKERFILE
          echo "--- Dockerfile ---"
          cat Dockerfile

      - name: Authenticate Docker to ECR (AWS CLI static credentials)
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t "$IMAGE_URI" -t "$ECR_REPOSITORY_URI:latest" .

      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE_URI"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:latest",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region $REGION --query SecretString --output text)",
              "ENV_ARGS=$(echo $ENV_JSON | python3 -c 'import json,sys; d=json.load(sys.stdin); allowed=[\"JWT_SECRET_KEY\",\"JWT_REFRESH_SECRET_KEY\",\"SQL_CONNECTION_STRING\"]; print(\" \".join([\"-e %s=%s\" % (k, d[k]) for k in allowed if k in d]))')",
              "docker run -d --restart always -p 80:8000 --name app $ENV_ARGS $IMAGE_URI"
            ]
          }
          SSMPARAMS
          echo "SSM parameters file written:"
          cat /tmp/ssm-params.json

      - name: Deploy to EC2 via SSM send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "::error::SSM send-command failed to return a CommandId"
            exit 1
          }
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "CommandInvocations[0].Status" --output text)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment command succeeded"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "::error::SSM command failed with status $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done
          echo "::error::SSM command timed out waiting for success"
          exit 1

  verify-health:
    runs-on: ubuntu-latest
    needs: [deploy-ec2-docker]
    steps:
      - name: Wait for application startup
        run: sleep 20

      - name: Verify health endpoint returns HTTP 200
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            cat /tmp/health.json 2>/dev/null || true
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check never returned HTTP 200 for $HEALTH_URL"
          exit 1