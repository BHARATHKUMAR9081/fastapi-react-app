name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  INSTANCE_ID: i-00857069f5cc6441a
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  PUBLIC_URL: http://16.4.70.64
  CONTAINER_PORT: "80"

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build diagnostics - toolchain versions
        run: |
          set -e
          echo "--- node ---"; node --version
          echo "--- npm ---"; npm --version
          echo "--- python ---"; python --version
          echo "--- pip ---"; pip --version
          echo "--- docker ---"; docker --version
          echo "--- aws ---"; aws --version || true

      - name: Diagnostics - frontend dependency install (devDependencies for tsc/vite)
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Diagnostics - frontend typecheck and build (tsc && vite build)
        working-directory: frontend
        run: npm run build

      - name: Diagnostics - backend dependency check (pip install -r requirements.txt)
        working-directory: backend
        run: |
          set -e
          pip install -r requirements.txt
          python -c "import fastapi, sqlmodel, uvicorn, jwt, passlib, decouple; print('backend imports OK')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (AWS CLI static credentials)
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image (context ., Dockerfile at repo root, port 80)
        run: |
          set -e
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          FULL_IMAGE="$ECR_REPOSITORY"
          docker buildx build \
            --file Dockerfile \
            --context . \
            --tag "${FULL_IMAGE}:latest" \
            --tag "${FULL_IMAGE}:${SHORT_SHA}" \
            --push \
            .
          echo "IMAGE_URI=${FULL_IMAGE}:latest" >> "$GITHUB_ENV"
          echo "Built and pushed ${FULL_IMAGE}:latest and ${FULL_IMAGE}:${SHORT_SHA}"

      - name: Deploy to EC2 via SSM send-command (docker pull and run on port 80)
        run: |
          set -e
          REGION="$AWS_REGION"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE_URI="$IMAGE_URI"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /etc/app.env 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:latest"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          sleep 10
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text || true)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || true
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

      - name: Verify - wait for container health (HTTP 200 on /api/v1/health via nginx port 80)
        run: |
          set -e
          HEALTH_URL="${PUBLIC_URL}/api/v1/health"
          echo "Polling $HEALTH_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "attempt $i -> HTTP $CODE"; cat /tmp/health.json || true
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            sleep 10
          done
          echo "Health check never returned HTTP 200"
          exit 1

      - name: Verify - public URL serves the SPA (HTTP 200)
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/")
          echo "public url HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "public URL did not return HTTP 200"
            exit 1
          fi
          echo "Public URL verification passed"