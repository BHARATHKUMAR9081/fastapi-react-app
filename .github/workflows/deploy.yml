name: build-deploy-verify-fastapi-react

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  INSTANCE_ID: i-0a6b402d2b8ad611f
  PUBLIC_URL: http://13.207.235.248
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  CONTAINER_PORT: "80"

jobs:
  build-and-push-image:
    name: Build diagnostics + Docker image push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (frontend toolchain diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (backend toolchain diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Backend build diagnostics (python version + dependency manifest)
        working-directory: backend
        run: |
          set -e
          python --version
          python -m pip --version
          echo "--- backend/requirements.txt ---"
          cat requirements.txt
          echo "--- backend/.env.example ---"
          cat .env.example
          test -f app/main.py && echo "FastAPI entrypoint app/main.py present"
          grep -n "health" app/api/api_v1/router.py || true

      - name: Frontend build diagnostics (npm ci/install + tsc && vite build)
        working-directory: frontend
        run: |
          set -e
          node --version
          npm --version
          echo "--- frontend/package.json ---"
          cat package.json
          npm install --legacy-peer-deps
          npm run build
          test -d dist && echo "Vite dist/ produced"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS CLI with static credentials
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "$AWS_REGION"

      - name: ECR login (direct AWS CLI, static credentials)
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build production Docker image (context = repo root, Dockerfile at .)
        run: |
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          docker build -f Dockerfile -t "$FULL_IMAGE" -t "$LATEST_IMAGE" .
          docker images "$ECR_REPOSITORY_URI"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Push image to ECR
        run: |
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"
          echo "Pushed $FULL_IMAGE and $LATEST_IMAGE"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS CLI with static credentials
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "$AWS_REGION"

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:latest",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRETS_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region ap-south-1 --query SecretString --output text)",
              "JWT_SECRET_KEY=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET_KEY\",\"\"))')",
              "JWT_REFRESH_SECRET_KEY=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_REFRESH_SECRET_KEY\",\"\"))')",
              "SQL_CONNECTION_STRING=$(echo \"$SECRETS_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SQL_CONNECTION_STRING\",\"sqlite:////data/database.db\"))')",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET_KEY=\"$JWT_SECRET_KEY\" -e JWT_REFRESH_SECRET_KEY=\"$JWT_REFRESH_SECRET_KEY\" -e SQL_CONNECTION_STRING=\"$SQL_CONNECTION_STRING\" -e BACKEND_CORS_ORIGINS=\"http://13.207.235.248\" $IMAGE_URI"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Dispatched SSM command $COMMAND_ID to $INSTANCE_ID"

      - name: Wait for SSM command completion
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --details \
            --query "CommandInvocations[0].Status" --output text)
          echo "SSM command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --details \
              --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
            exit 1
          fi

  verify-deployment:
    name: Verify public health endpoint returns HTTP 200
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Wait for container startup (nginx + uvicorn start-period)
        run: sleep 30

      - name: Health check via public URL (must be HTTP 200)
        run: |
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Checking $HEALTH_URL"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $HEALTH_URL"
          exit 1

      - name: Verify SPA served at root (must be HTTP 200)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/")
          echo "Root URL returned HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "SPA root check failed"
            exit 1
          fi