name: Deploy FastAPI + React to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fastapi-react-app
  INSTANCE_ID: i-03fdd22133e18bfe0
  SECRET_ID: deptic/fastapi-react-app/secrets
  PUBLIC_URL: http://13.202.219.162

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for frontend build diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify frontend builds
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Setup Python for backend diagnostics
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify backend dependencies and app import
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import ast,sys; ast.parse(open('app/main.py').read())"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build and push image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${{ github.sha }}" .
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${{ github.sha }}"
          echo "IMAGE_URI=$FULL_IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGION="$AWS_REGION"
          ECR_REGISTRY="$ECR_REGISTRY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          INSTANCE_ID="$INSTANCE_ID"
          SECRET_ID="$SECRET_ID"

          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY" || true

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "SECRETS_JSON=$(aws secretsmanager get-secret-value --secret-id ${SECRET_ID} --region ${REGION} --query SecretString --output text)",
              "JWT_SECRET_KEY=$(echo \"$SECRETS_JSON\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"JWT_SECRET_KEY\"])')",
              "JWT_REFRESH_SECRET_KEY=$(echo \"$SECRETS_JSON\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"JWT_REFRESH_SECRET_KEY\"])')",
              "SQL_CONNECTION_STRING=$(echo \"$SECRETS_JSON\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"SQL_CONNECTION_STRING\"])')",
              "docker pull ${IMAGE_URI}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:8000 --name app -e JWT_SECRET_KEY=\"$JWT_SECRET_KEY\" -e JWT_REFRESH_SECRET_KEY=\"$JWT_REFRESH_SECRET_KEY\" -e SQL_CONNECTION_STRING=\"$SQL_CONNECTION_STRING\" ${IMAGE_URI}"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy fastapi-react-app ${{ github.sha }}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --region "$REGION"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/api/v1/health" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed at $PUBLIC_URL/api/v1/health"
          exit 1