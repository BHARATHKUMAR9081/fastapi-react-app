name: Build and Deploy FastAPI React App to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fastapi-react-app
  INSTANCE_ID: i-0e8d86612f703a12c
  PUBLIC_URL: http://3.108.70.64

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:${GITHUB_SHA::8}" -f Dockerfile .
          docker image inspect "$FULL_IMAGE:latest" --format 'Built image {{.Id}} ({{.Size}} bytes)'

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to Amazon ECR and push image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${GITHUB_SHA::8}"

      - name: Fetch runtime secrets from AWS Secrets Manager
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws secretsmanager get-secret-value \
            --secret-id "deptic/fastapi-react-app/secrets" \
            --region "$AWS_REGION" \
            --query SecretString --output text > /tmp/app-secrets.json
          echo "Secrets fetched: $(wc -c < /tmp/app-secrets.json) bytes"

      - name: Deploy to EC2 via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
            --output text

      - name: Verify container is running
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          cat > /tmp/ssm-verify.json << 'SSMVERIFY'
          {
            "commands": [
              "docker ps --filter name=app --format '{{.Names}} {{.Status}} {{.Ports}}'"
            ]
          }
          SSMVERIFY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-verify.json \
            --query "Command.CommandId" --output text)
          sleep 15
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query StandardOutputContent --output text

      - name: Health check (must return HTTP 200)
        run: |
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Checking $HEALTH_URL"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              curl -s "$HEALTH_URL"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after retries."
          exit 1