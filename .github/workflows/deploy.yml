name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fastapi-react-app
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-00857069f5cc6441a
  PUBLIC_URL: http://16.4.70.64
  CONTAINER_PORT: "80"
  DOCKERFILE_PATH: .
  HEALTH_PATH: /api/v1/health

jobs:
  build-and-push:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository layout and deployment evidence
        run: |
          set -euo pipefail
          test -fbackend/requirements.txt
          test -ffrontend/package.json
          test -fbackend/app/main.py
          test -fbackend/.env.example
          test -ffrontend/index.html
          grep -q "health" backend/app/api/api_v1/router.py
          grep -q "API_V1_STR" backend/app/main.py
          echo "Repository layout verified (FastAPI backend + Vite React frontend)."

      - name: Set up Node.js (frontend toolchain diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python (backend toolchain diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build diagnostics - toolchain versions
        run: |
          set -euo pipefail
          echo "--- node ---"; node --version
          echo "--- npm ---"; npm --version
          echo "--- python ---"; python --version
          echo "--- pip ---"; pip --version

      - name: Frontend diagnostics - install and typecheck/build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps
          npm run build
          test -d dist
          test -f dist/index.html
          echo "Frontend Vite build produced dist/ successfully."

      - name: Backend diagnostics - install requirements and import app
        working-directory: backend
        run: |
          set -euo pipefail
          cp .env.example .env
          pip install -r requirements.txt
          python -c "import fastapi, sqlmodel, uvicorn, jwt, passlib; print('backend deps OK')"
          python -c "from app.main import app; print('FastAPI app import OK:', app.title)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static credentials via AWS CLI env)
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image tags
        id: image
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_URI="${FULL_IMAGE}:latest"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Building and pushing $IMAGE_URI (commit $SHORT_SHA)"

      - name: Build and push Docker image (unified nginx + uvicorn runtime)
        run: |
          set -euo pipefail
          FULL_IMAGE="${{ steps.image.outputs.FULL_IMAGE }}"
          docker build \
            --file Dockerfile \
            --tag "$FULL_IMAGE:latest" \
            --tag "$FULL_IMAGE:${{ steps.image.outputs.SHORT_SHA }}" \
            "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${{ steps.image.outputs.SHORT_SHA }}"
          echo "Image pushed to $FULL_IMAGE"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:latest",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /opt/app/.env $IMAGE_URI",
              "sleep 5",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          echo "SSM parameters file written:"
          cat /tmp/ssm-params.json

      - name: Ensure remote env file from Secrets Manager exists on instance
        run: |
          set -euo pipefail
          cat > /tmp/ssm-env-setup.json << 'SSMENV'
          {
            "commands": [
              "set -e",
              "mkdir -p /opt/app",
              "if [ ! -f /opt/app/.env ]; then",
              "  aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region ap-south-1 --query SecretString --output text > /opt/app/.env",
              "  chmod 600 /opt/app/.env",
              "fi",
              "grep -q SQL_CONNECTION_STRING /opt/app/.env || echo 'SQL_CONNECTION_STRING=sqlite:///database.db' >> /opt/app/.env",
              "echo env file ready"
            ]
          }
          SSMENV
          ENV_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-env-setup.json \
            --query "Command.CommandId" --output text)
          echo "ENV_COMMAND_ID=$ENV_COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$ENV_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$ENV_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query Status --output text)
          echo "Env setup status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Remote env setup failed"
            aws ssm get-command-invocation --command-id "$ENV_COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"
            exit 1
          fi

      - name: Send deployment command via SSM
        id: deploy
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment command completion
        run: |
          set -euo pipefail
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query Status --output text)
          echo "Deploy command status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed; command output:"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION"
            exit 1
          fi

  verify:
    name: Verify production health endpoint
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check - expect HTTP 200 on /api/v1/health
        run: |
          set -euo pipefail
          HEALTH_URL="$PUBLIC_URL$HEALTH_PATH"
          echo "Checking $HEALTH_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Health check passed with HTTP 200."
              exit 0
            fi
            sleep 10
          done
          echo "Health check never returned HTTP 200."
          exit 1

      - name: Verify SPA served by nginx on port 80
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "$PUBLIC_URL/")
          echo "Root URL returned HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "SPA root check failed"
            exit 1
          fi
          grep -qi "<div id=\"root\">" /tmp/index.html
          echo "Frontend SPA served correctly."