name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-00857069f5cc6441a
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  PUBLIC_URL: http://16.4.70.64
  CONTAINER_PORT: "80"

jobs:
  build-and-push:
    name: Build diagnostics and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (frontend toolchain diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (backend toolchain diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Backend build diagnostics
        working-directory: backend
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m pip install -r requirements.txt
          python -c "import app.main; print('FastAPI app import OK:', app.main.app.title)"

      - name: Frontend build diagnostics
        working-directory: frontend
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html && echo "Vite dist bundle produced OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Authenticate Docker to ECR (AWS CLI static credentials)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REPOSITORY_URI"

      - name: Build production image (context=. dockerfile=.) and push to ECR
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -t "$ECR_REPOSITORY_URI:latest" -f Dockerfile .
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "Pushed image: $FULL_IMAGE"

  deploy-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull runtime secrets from AWS Secrets Manager
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" \
            --query SecretString --output text > /tmp/app-secret.json
          echo "Secret retrieved (contents redacted)"

      - name: Write SSM commands payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:${IMAGE_TAG}",
              "SECRET_STRING=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region $REGION --query SecretString --output text)",
              "JWT_SECRET_KEY=$(printf '%s' \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET_KEY\",\"my-secret\"))' 2>/dev/null || echo my-secret)",
              "JWT_REFRESH_SECRET_KEY=$(printf '%s' \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"JWT_REFRESH_SECRET_KEY\",\"another-secret\"))' 2>/dev/null || echo another-secret)",
              "SQL_CONNECTION_STRING=$(printf '%s' \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"SQL_CONNECTION_STRING\",\"sqlite:///database.db\"))' 2>/dev/null || echo sqlite:///database.db)",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET_KEY=$JWT_SECRET_KEY -e JWT_REFRESH_SECRET_KEY=$JWT_REFRESH_SECRET_KEY -e SQL_CONNECTION_STRING=$SQL_CONNECTION_STRING $IMAGE_URI"
            ]
          }
          SSMPARAMS
          python3 - << 'PYEOF'
          import re
          path = "/tmp/ssm-params.json"
          with open(path) as f:
              content = f.read()
          content = content.replace("${IMAGE_TAG}", "${{ needs.build-and-push.outputs.image_tag }}")
          with open(path, "w") as f:
              f.write(content)
          import json
          json.load(open(path))
          print("ssm-params.json is valid JSON")
          PYEOF

      - name: Send deployment command via SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status: $STATUS"; exit 1 ;;
            esac
          done
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed in time (last status: $STATUS)"
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text | tail -n 40

  verify:
    name: Verify production health endpoint
    runs-on: ubuntu-latest
    needs: deploy-ec2
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Probing $HEALTH_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo ""
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $HEALTH_URL"
          exit 1