name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-00857069f5cc6441a
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  PUBLIC_URL: http://16.4.70.64
  CONTAINER_PORT: "80"

jobs:
  build-push-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (frontend toolchain for diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (backend toolchain for diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Backend build diagnostics
        working-directory: backend
        run: |
          set -e
          python --version
          python -m pip --version
          python -m pip install --no-cache-dir -r requirements.txt
          python -c "import app.main; print('FastAPI app imports OK:', app.main.app.title)"

      - name: Frontend build diagnostics
        working-directory: frontend
        run: |
          set -e
          node --version
          npm --version
          npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html && echo "Vite dist bundle produced"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate AWS CLI and ECR (static credentials, direct CLI)
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image tag
        id: image
        run: |
          set -e
          IMAGE_TAG="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building image: $FULL_IMAGE"

      - name: Build and push Docker image (context=., port 80 nginx+uvicorn topology)
        run: |
          set -e
          docker buildx build \
            --file Dockerfile \
            --tag "$ECR_REPOSITORY_URI:${{ steps.image.outputs.IMAGE_TAG }}" \
            --tag "$ECR_REPOSITORY_URI:latest" \
            --push \
            .

      - name: Deploy to EC2 via SSM send-command
        run: |
          set -e
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:${{ steps.image.outputs.IMAGE_TAG }}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /etc/app/env $IMAGE_URI",
              "docker ps"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"; exit 1 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command timed out"; exit 1; }

      - name: Verify deployment health (HTTP 200 only)
        run: |
          set -e
          echo "Waiting for app to become healthy at $PUBLIC_URL/api/v1/health ..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$PUBLIC_URL/api/v1/health" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed; never received HTTP 200"
          exit 1