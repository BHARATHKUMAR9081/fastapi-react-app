name: Build and Deploy FastAPI-React App to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fastapi-react-app
  IMAGE_TAG: latest
  INSTANCE_ID: i-03fdd22133e18bfe0
  PUBLIC_URL: http://13.202.219.162
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static)
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "$AWS_REGION"

      - name: Build Docker image (with diagnostics)
        run: |
          set -o pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building image: $FULL_IMAGE"
          docker build -f Dockerfile -t "$FULL_IMAGE" . 2>&1 | tee build.log || { echo "::error::Docker build failed, see build.log tail"; tail -n 100 build.log; exit 1; }
          echo "Build succeeded"
          docker images | grep "$ECR_REPOSITORY"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push image to ECR
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$FULL_IMAGE"
          echo "Pushed $FULL_IMAGE"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials (static)
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "$AWS_REGION"

      - name: Pull runtime secrets and inject into instance environment
        run: |
          echo "Fetching secrets from Secrets Manager ($SECRETS_MANAGER_ID) for use at deploy time"
          aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" --query SecretString --output text > /tmp/secrets.json
          test -s /tmp/secrets.json || { echo "::error::No secrets returned"; exit 1; }
          rm -f /tmp/secrets.json

      - name: Deploy container to EC2 via SSM
        run: |
          set -o pipefail
          REGION="$AWS_REGION"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          INSTANCE_ID_REF="$INSTANCE_ID"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID_REF" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy fastapi-react-app" \
            --parameters file:///tmp/ssm-params.json \
            --output text --query "Command.CommandId")
          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed --instance-id "$INSTANCE_ID_REF" \
            --command-id "$COMMAND_ID" --region "$REGION" || true
          RESULT=$(aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID_REF" \
            --command-id "$COMMAND_ID" --region "$REGION")
          STATUS=$(echo "$RESULT" | jq -r .Status)
          echo "Deployment status: $STATUS"
          echo "--- stdout ---"; echo "$RESULT" | jq -r .StandardOutputContent
          echo "--- stderr ---"; echo "$RESULT" | jq -r .StandardErrorContent
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy command failed"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check (must return HTTP 200)
        run: |
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Checking health at $HEALTH_URL"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/health_body -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Healthy! Response: $(cat /tmp/health_body)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed after 15 attempts (last status: $CODE)"
          exit 1