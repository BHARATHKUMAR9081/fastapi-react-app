name: build-deploy-verify-fastapi-react-app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app
  EC2_INSTANCE_ID: i-0a6b402d2b8ad611f
  SECRETS_MANAGER_ID: deptic/fastapi-react-app/secrets
  CONTAINER_PORT: "80"
  PUBLIC_URL: http://13.207.235.248

jobs:
  build-push-deploy-verify:
    name: Build, Push, Deploy (EC2 Docker), Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (frontend toolchain diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (backend toolchain diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build diagnostics - toolchain versions
        run: |
          set -euo pipefail
          echo "::group::Toolchain versions"
          node --version
          npm --version
          python --version
          pip --version
          docker --version
          aws --version || true
          echo "::endgroup::"

      - name: Build diagnostics - repository layout
        run: |
          set -euo pipefail
          echo "::group::Repository layout"
          ls -la
          echo "--- backend ---"
          ls -la backend
          echo "--- frontend ---"
          ls -la frontend
          test -f backend/requirements.txt
          test -f backend/app/main.py
          test -f frontend/package.json
          test -f frontend/index.html
          echo "::endgroup::"

      - name: Backend diagnostics - install pinned requirements
        run: |
          set -euo pipefail
          echo "::group::pip install -r backend/requirements.txt"
          pip install -r backend/requirements.txt
          echo "::endgroup::"

      - name: Backend diagnostics - import app.main
        working-directory: backend
        env:
          JWT_SECRET_KEY: diag-secret
          JWT_REFRESH_SECRET_KEY: diag-refresh-secret
          SQL_CONNECTION_STRING: sqlite:///diagnostic.db
        run: |
          set -euo pipefail
          python -c "from app.main import app; print('FastAPI app import OK:', app.title)"

      - name: Frontend diagnostics - npm install
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps

      - name: Frontend diagnostics - tsc + vite build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build
          test -d dist
          test -f dist/index.html
          echo "Vite build output OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to ECR (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build production image (repo-root context, Dockerfile at .)
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          echo "FULL_IMAGE=$FULL_IMAGE"
          echo "LATEST_IMAGE=$LATEST_IMAGE"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          docker buildx build --load -t "$FULL_IMAGE" -t "$LATEST_IMAGE" -f Dockerfile .

      - name: Image diagnostics - embedded healthcheck inspect
        run: |
          set -euo pipefail
          docker image inspect "$FULL_IMAGE" --format 'EXPOSED_PORTS={{json .Config.ExposedPorts}} HEALTHCHECK={{json .Config.Healthcheck}}'

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Deploy to EC2 via SSM send-command (file-based parameters)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi-react-app:latest",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "SECRET_STRING=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi-react-app/secrets --region ap-south-1 --query SecretString --output text)",
              "JWT_SECRET_KEY=$(echo \"$SECRET_STRING\" | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"JWT_SECRET_KEY\"])' 2>/dev/null || echo \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET_KEY\", d.get(\"jwt_secret_key\",\"\")))')",
              "JWT_REFRESH_SECRET_KEY=$(echo \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"JWT_REFRESH_SECRET_KEY\", d.get(\"jwt_refresh_secret_key\",\"\")))')",
              "SQL_CONNECTION_STRING=$(echo \"$SECRET_STRING\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(\"SQL_CONNECTION_STRING\", d.get(\"sql_connection_string\",\"sqlite:////data/database.db\")))')",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e JWT_SECRET_KEY=\"$JWT_SECRET_KEY\" -e JWT_REFRESH_SECRET_KEY=\"$JWT_REFRESH_SECRET_KEY\" -e SQL_CONNECTION_STRING=\"$SQL_CONNECTION_STRING\" -e BACKEND_CORS_ORIGINS=http://13.207.235.248 $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded"
              exit 0
            fi
            case "$STATUS" in
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --output json || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::SSM command did not complete in time (last status: $STATUS)"
          exit 1

      - name: Wait for application health and verify HTTP 200
        run: |
          set -euo pipefail
          HEALTH_URL="$PUBLIC_URL/api/v1/health"
          echo "Polling $HEALTH_URL"
          CODE=""
          for i in $(seq 1 45); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check body:"
              cat /tmp/health.json
              break
            fi
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::Health check failed; last HTTP code: $CODE"
            exit 1
          fi
          echo "Health check passed with HTTP 200"

      - name: Verify frontend SPA served at root
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /tmp/index.html -w '%{http_code}' "$PUBLIC_URL/")
          echo "GET / -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Frontend root check failed with HTTP $CODE"
            exit 1
          fi
          head -c 400 /tmp/index.html
          echo "Frontend served OK"

      - name: Deployment summary
        run: |
          {
            echo "### Deployment summary"
            echo "- Image: $FULL_IMAGE"
            echo "- Region: $AWS_REGION"
            echo "- Instance: $EC2_INSTANCE_ID"
            echo "- Public URL: $PUBLIC_URL"
            echo "- Health: $PUBLIC_URL/api/v1/health (HTTP 200)"
          } >> "$GITHUB_STEP_SUMMARY"